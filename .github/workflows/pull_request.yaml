name: pull_request
on: 
  pull_request:
    branches: [ main ]
jobs:
  php_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: PHP lint
        run: |
          php -l index.php
 